<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Feyto</title>
<style>
  :root { --bg: #FFF6F5; --card: #fff; --text: #232323; --muted: #6b6560; --accent: #F86244; --danger: #c8341a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #262523; --card: #302e2b; --text: #f2efec; --muted: #b5aea8; --danger: #ff8a70; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width: 100%; max-width: 420px; background: var(--card); border-radius: 16px; padding: 32px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo { width: 44px; height: 44px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; }
  .brand b { font-size: 18px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .err h1 { color: var(--danger); }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="brand">
    <span class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <b>Feyto</b>
  </div>
  <h1 id="title">E-mail confirmado</h1>
  <p id="text">Pronto! Volte ao Feyto, clique em <strong>Entrar</strong> e use o e-mail e a senha que você criou.</p>
  <p id="hint">Pode fechar esta página.</p>
</main>
<script>
  // O Supabase volta para cá com o resultado no endereço; sem erro = confirmado.
  var h = new URLSearchParams(location.hash.slice(1) + "&" + location.search.slice(1));
  if (h.get("error")) {
    document.getElementById("card").className = "card err";
    document.getElementById("title").textContent = "Este link não vale mais";
    document.getElementById("text").innerHTML = "Ele venceu ou já foi usado. Abra o Feyto e clique em <strong>Entrar</strong> com seu e-mail e senha: se a conta ainda não estiver confirmada, enviamos um link novo. Use sempre o último e-mail que chegar.";
    document.getElementById("hint").textContent = "";
  }
  // não deixa o token da sessão parado na barra de endereço
  if (location.hash) history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
